// We use proto3, the modern standard for gRPC
syntax = "proto3";

// We define a namespace to prevent naming collisions if we add more services later
package identity;

// ---------------------------------------------------------
// THE SERVICE (The Methods)
// ---------------------------------------------------------
// This defines the exact functions the BFF is allowed to call on this microservice
service IdentityService {
  // Synchronous check to see if a user is allowed to upload a document
  rpc ValidateUserAccess (AccessRequest) returns (AccessResponse);
}

// ---------------------------------------------------------
// THE MESSAGES (The Data Payload)
// ---------------------------------------------------------
// The exact shape of the data the BFF sends to us
message AccessRequest {
  // The '1' and '2' are memory tags. gRPC sends binary data, not JSON! 
  // These tags tell the server exactly where in the memory block to find the variable.
  string userId = 1;
  string requiredRole = 2;
}

// The exact shape of the data we send back to the BFF
message AccessResponse {
  bool isAuthorized = 1;
  string message = 2;
}